[versions]

teavm = "0.13.1"
# core+classlib only: locally built & published (see teavm-patch/README.md) from TeaVM's own
# 0.13.1 tag with targeted patches — a classlib fix for TDecimalFormat's symbol-copying (worked
# around a WASM-GC backend bug that crashed every printf/String.format call), a core fix for
# BoundCheckInsertion incorrectly eliding array bounds checks when both the index and array size
# are compile-time constants without comparing their actual values, and a core fix for
# WasmGCVirtualTableBuilder dropping a method's vtable implementor whenever TeaVM's
# devirtualization pass hadn't independently marked that method "virtual" — which left calls like
# e.getMessage() on a caught VM-thrown exception invoking a null function reference at runtime.
# Everything else stays on the real published 0.13.1 — this isn't a general TeaVM upgrade, just
# these specific fixes.
teavmPatched = "0.13.1-patched7"
asm = "9.8"

[libraries]

teavm-core = { module = "org.teavm:teavm-core", version.ref = "teavmPatched" }
teavm-classlib = { module = "org.teavm:teavm-classlib", version.ref = "teavmPatched" }
teavm-tooling = { module = "org.teavm:teavm-tooling", version.ref = "teavm" }
teavm-jso-impl = { module = "org.teavm:teavm-jso-impl", version.ref = "teavm" }
teavm-jso = { module = "org.teavm:teavm-jso", version.ref = "teavm" }
teavm-jso-apis = { module = "org.teavm:teavm-jso-apis", version.ref = "teavm" }
teavm-interop = { module = "org.teavm:teavm-interop", version.ref = "teavm" }
teavm-platform = { module = "org.teavm:teavm-platform", version.ref = "teavm" }
asm-core = { module = "org.ow2.asm:asm", version.ref = "asm" }
jzlib = "com.jcraft:jzlib:1.1.3"

[plugins]

teavm = { id = "org.teavm", version.ref = "teavm" }
teavm-library = { id = "org.teavm.library", version.ref = "teavm" }
download = { id = "de.undercouch.download", version = "5.6.0" }
nodejs = { id = "com.github.node-gradle.node", version = "7.1.0" }
gretty = { id = "org.gretty", version = "4.1.6" }
